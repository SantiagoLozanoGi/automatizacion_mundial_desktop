[project]
name = "automatizacion-mundial"
dynamic = ["version"]
description = "Aplicación de escritorio modular con lógica heredada migrada desde Streamlit"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "openpyxl",
    "reportlab",
    "pypdf",
    "PySide6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "workflows"]

[tool.setuptools.dynamic]
version = {attr = "version.APP_VERSION"}
